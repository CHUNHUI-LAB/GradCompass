name: Desktop candidate evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: desktop-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate capture contracts without a browser
        run: python3 -m unittest discover -s tests -p 'test_desktop_screenshots.py' -v
      - name: Install pinned Ubuntu Chinese screenshot font
        run: |
          python3 - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          # Ubuntu noble package; Noto CJK font software uses SIL OFL 1.1.
          # https://packages.ubuntu.com/noble/all/fonts-noto-cjk/download
          url = 'https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-noto-cjk/fonts-noto-cjk_20230817+repack1-3_all.deb'
          data = urllib.request.urlopen(url, timeout=120).read()
          if len(data) != 61229778 or hashlib.sha256(data).hexdigest() != '7d64b985f6fe128c99eae5610d5c047338e572bdcfb2bb09736be01b824a7f6c':
              raise RuntimeError('Ubuntu font package bytes do not match the official pinned checksum')
          (Path(os.environ['RUNNER_TEMP']) / 'fonts-noto-cjk.deb').write_bytes(data)
          PY
          sudo apt-get install --yes --no-install-recommends "$RUNNER_TEMP/fonts-noto-cjk.deb"
          test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = '1:20230817+repack1-3'
      - name: Capture bounded desktop scenarios in preinstalled Chrome
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/desktop_screenshots.py --output desktop-screenshots
      - name: Preserve screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradcompass-desktop-${{ github.event.pull_request.head.sha }}
          path: desktop-screenshots/
          if-no-files-found: error
          retention-days: 7

