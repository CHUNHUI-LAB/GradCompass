name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Node tests and freeze validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      npm_config_offline: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check runtime versions and JavaScript syntax
        run: |
          node --version
          npm --version
          python --version
          python3 --version
          for file in assets/*.js scripts/*.mjs tests/*.mjs; do
            node --check "$file"
          done
      - name: Run all Node and freeze-preservation tests
        run: npm test
      - name: Check committed freeze output and idempotence
        run: |
          python scripts/freeze.py
          git diff --exit-code
          python scripts/freeze.py
          git diff --exit-code
